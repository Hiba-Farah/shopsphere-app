services:

  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopsphere

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    container_name: redis-db
    restart: always

    ports:
      - "6379:6379"


  user-service:
    build:
      context: ./user-service

    container_name: user-service
    restart: always

    ports:
      - "3001:3001"

    env_file:
      - ./user-service/.env

    depends_on:
      - postgres


  product-service:
    build:
      context: ./product-service

    container_name: product-service
    restart: always

    ports:
      - "3002:3002"

    env_file:
      - ./product-service/.env

    depends_on:
      - postgres


  order-service:
    build:
      context: ./order-service

    container_name: order-service
    restart: always

    ports:
      - "3003:3003"

    env_file:
      - ./order-service/.env

    depends_on:
      - postgres


  cart-service:
    build:
      context: ./cart-service

    container_name: cart-service
    restart: always

    ports:
      - "3004:3004"

    env_file:
      - ./cart-service/.env

    depends_on:
      - redis

  notification-service:
    build:
      context: ./notification-service

    container_name: notification-service

    restart: always

    ports:
      - "3005:3005"

    env_file:
      - ./notification-service/.env

  api-gateway:
    build:
      context: ./api-gateway

    container_name: api-gateway

    restart: always

    ports:
      - "8080:8080"

    env_file:
      - ./api-gateway/.env

    depends_on:
      - user-service
      - product-service
      - order-service
      - cart-service
      - notification-service
  frontend:
    build:
      context: ./frontend

    container_name: frontend

    restart: always

    ports:
      - "5173:80"

    depends_on:
      - api-gateway

volumes:
  postgres_data:
