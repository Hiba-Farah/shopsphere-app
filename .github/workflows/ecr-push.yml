name: Build and Push Docker Images to ECR

on:
  push:
    branches:
      - shopsphere-App

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: "136609826386"

jobs:

  # ============================================================
  # Detect which services changed
  # ============================================================

  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.set-services.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed services
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            user:
              - 'user-service/**'

            product:
              - 'product-service/**'

            order:
              - 'order-service/**'

            cart:
              - 'cart-service/**'

            notification:
              - 'notification-service/**'

            gateway:
              - 'api-gateway/**'

            frontend:
              - 'frontend/**'

      - name: Build service matrix
        id: set-services
        shell: bash
        env:
          USER_CHANGED: ${{ steps.changes.outputs.user }}
          PRODUCT_CHANGED: ${{ steps.changes.outputs.product }}
          ORDER_CHANGED: ${{ steps.changes.outputs.order }}
          CART_CHANGED: ${{ steps.changes.outputs.cart }}
          NOTIFICATION_CHANGED: ${{ steps.changes.outputs.notification }}
          GATEWAY_CHANGED: ${{ steps.changes.outputs.gateway }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend }}
        run: |
          services=()

          if [ "$USER_CHANGED" = "true" ]; then
            services+=("user-service")
          fi

          if [ "$PRODUCT_CHANGED" = "true" ]; then
            services+=("product-service")
          fi

          if [ "$ORDER_CHANGED" = "true" ]; then
            services+=("order-service")
          fi

          if [ "$CART_CHANGED" = "true" ]; then
            services+=("cart-service")
          fi

          if [ "$NOTIFICATION_CHANGED" = "true" ]; then
            services+=("notification-service")
          fi

          if [ "$GATEWAY_CHANGED" = "true" ]; then
            services+=("api-gateway")
          fi

          if [ "$FRONTEND_CHANGED" = "true" ]; then
            services+=("frontend")
          fi

          if [ ${#services[@]} -eq 0 ]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -sc .)
            echo "services=$json" >> "$GITHUB_OUTPUT"
          fi


  # ============================================================
  # Build and Push
  # ============================================================

  build-and-push:
    name: Build and Push
    needs: detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::136669826386:role/shopsphere-eks-GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Docker
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Calculate next vX version
      # --------------------------------------------------------

      - name: Calculate next image version
        id: version
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |

          set -e

          REPOSITORY="shopsphere-${SERVICE}"

          echo "Repository: $REPOSITORY"

          TAGS=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'imageDetails[].imageTags[]' \
            --output text 2>/dev/null || true)

          VERSION=$(echo "$TAGS" \
            | tr '\t' '\n' \
            | grep -E '^v[0-9]+$' \
            | sed 's/^v//' \
            | sort -n \
            | tail -1 || true)

          if [ -z "$VERSION" ]; then
            NEXT_VERSION=1
          else
            NEXT_VERSION=$((VERSION + 1))
          fi

          echo "Current version: ${VERSION:-none}"
          echo "Next version: v${NEXT_VERSION}"

          echo "version=v${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Build & Push
      # --------------------------------------------------------

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true

          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/shopsphere-${{ matrix.service }}:${{ steps.version.outputs.version }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/shopsphere-${{ matrix.service }}:${{ github.sha }}

          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}