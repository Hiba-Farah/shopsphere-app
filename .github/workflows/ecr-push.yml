name: Build and Push Docker Images to ECR

on:
  push:
    branches:
      - shopsphere-App

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: "136609826386"

jobs:

  # 1. Detect which services have changed

  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      user-service: ${{ steps.filter.outputs.user }}
      product-service: ${{ steps.filter.outputs.product }}
      order-service: ${{ steps.filter.outputs.order }}
      cart-service: ${{ steps.filter.outputs.cart }}
      notification-service: ${{ steps.filter.outputs.notification }}
      api-gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |

            user:
              - 'user-service/**'

            product:
              - 'product-service/**'

            order:
              - 'order-service/**'

            cart:
              - 'cart-service/**'

            notification:
              - 'notification-service/**'

            gateway:
              - 'api-gateway/**'

            frontend:
              - 'frontend/**'


  # 2. Build and Push only changed services

  build-and-push:
    name: Build and Push
    needs: detect-changes

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - service: user-service
            output: user-service

          - service: product-service
            output: product-service

          - service: order-service
            output: order-service

          - service: cart-service
            output: cart-service

          - service: notification-service
            output: notification-service

          - service: api-gateway
            output: api-gateway

          - service: frontend
            output: frontend

    # Only run the matrix entry when this service changed
    if: needs.detect-changes.outputs[matrix.output] == 'true'

    steps:

      # Checkout

      - name: Checkout repository
        uses: actions/checkout@v4


      # AWS credentials using OIDC

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::136609826386:role/shopsphere-eks-GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}


      # Login to ECR

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # Setup Docker Buildx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # Calculate next version from ECR

      - name: Calculate next image version
        id: version
        shell: bash
        run: |

          set -e

          REPOSITORY="shopsphere-${{ matrix.service }}"

          echo "Repository: $REPOSITORY"

          echo "Searching existing version tags in ECR..."

          TAGS=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'imageDetails[].imageTags[]' \
            --output text 2>/dev/null || true)

          echo "Existing tags:"
          echo "$TAGS"

          # Keep only tags exactly matching v<number>
          VERSION=$(echo "$TAGS" \
            | tr '\t' '\n' \
            | grep -E '^v[0-9]+$' \
            | sed 's/^v//' \
            | sort -n \
            | tail -1 || true)

          if [ -z "$VERSION" ]; then
            NEXT_VERSION=1
          else
            NEXT_VERSION=$((VERSION + 1))
          fi

          IMAGE_TAG="v${NEXT_VERSION}"

          echo "Next version: $IMAGE_TAG"

          echo "version=$IMAGE_TAG" >> "$GITHUB_OUTPUT"


      # Build and push image

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:

          context: ./${{ matrix.service }}

          push: true

          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/shopsphere-${{ matrix.service }}:${{ steps.version.outputs.version }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/shopsphere-${{ matrix.service }}:${{ github.sha }}

          cache-from: type=gha,scope=${{ matrix.service }}

          cache-to: type=gha,mode=max,scope=${{ matrix.service }}


      # Display generated tags

      - name: Display image tags
        run: |

          echo "=========================================="
          echo "Service: ${{ matrix.service }}"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Git SHA: ${{ github.sha }}"
          echo "=========================================="